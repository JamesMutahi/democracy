<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-200 -200 400 400" width="400" height="400">
  <defs>
    <path id="spearshape" d="M-1,55.4 L1,55.4 L1,-38 C3,-40 3,-43 3,-46 C3,-48 3,-56 0,-64.7 C-3,-56 -3,-48 -3,-46 C-3,-43 -3,-40 -1,-38z" transform="matrix(0.866,0.5,-0.5,0.866,0,0)"/>
  </defs>
  <g transform="matrix(3.654,0,0,3.654,0.3,14.27)">
    <!-- Spears with distinct black borders -->
    <use xlink:href="#spearshape" fill="#fff" stroke="#000" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
    <use xlink:href="#spearshape" transform="scale(-1,1)" fill="#fff" stroke="#000" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Shield Body with light grey border -->
    <path d="M-19,24 C-16,32 -6,48 0,48 C6,48 16,32 19,24 L19,-24 C16,-32 6,-48 0,-48 C-6,-48 -16,-32 -19,-24z" fill="#b00" stroke="#ccc" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Shield Black Decorations with light grey border to prevent merging with black backgrounds -->
    <path id="deco_r" d="M19,24 C22,16 24,8 24,0 C24,-8 22,-16 19,-24 C16,-16 14,-8 14,0 C14,8 16,16 19,24" fill="#000" stroke="#ccc" stroke-width="0.8" stroke-linejoin="round"/>
    <use xlink:href="#deco_r" transform="scale(-1,1)"/>
    
    <!-- Shield White Decorations -->
    <g fill="#fff">
      <ellipse cx="0" cy="0" rx="4" ry="6"/>
      <path id="deco_br" d="M1,5.85 C1,5.85 5,13.85 5,26.85 C5,39.85 1,47.85 1,47.85z"/>
      <use xlink:href="#deco_br" transform="scale(-1,-1)"/>
      <use xlink:href="#deco_br" transform="scale(-1,1)"/>
      <use xlink:href="#deco_br" transform="scale(1,-1)"/>
    </g>
  </g>
</svg>